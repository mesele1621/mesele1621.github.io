<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .cv-container { max-width: 900px; margin: 0 auto; background: white; color: #333; padding: 4rem; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .cv-header { border-bottom: 2px solid #333; padding-bottom: 2rem; margin-bottom: 2rem; }
        .cv-section { margin-bottom: 2rem; }
        .cv-section h3 { border-bottom: 1px solid #eee; padding-bottom: 0.5rem; margin-bottom: 1rem; color: #0a192f; text-transform: uppercase; letter-spacing: 1px; }
        .cv-item { margin-bottom: 1rem; display: grid; grid-template-columns: 150px 1fr; gap: 1rem; }
        .cv-date { font-weight: 700; color: #666; font-size: 0.9rem; }
        
        @media print {
            .navbar, footer, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .cv-container { box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
            main { padding-top: 0 !important; }
        }
        
        [data-theme="dark"] .cv-container { background: #112240; color: #ccd6f6; }
        [data-theme="dark"] .cv-section h3 { border-color: #233554; color: #64ffda; }
    </style>
</head>
<body data-page="cv">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link">Publications</a>
                <a href="software.html" class="nav-link">Software</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="cv.html" class="nav-link active">CV</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 5rem;">
        <div class="no-print" style="text-align: right; margin-bottom: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="files/CV.pdf" class="btn btn-primary"><i class="fas fa-download"></i> Download PDF</a>
            <button onclick="window.print()" class="btn btn-outline"><i class="fas fa-print"></i> Print CV</button>
        </div>

        <div class="cv-container glass-card">
            <div class="cv-header">
                <h1 id="cv-name"></h1>
                <p id="cv-title"></p>
                <div style="display: flex; gap: 2rem; margin-top: 1rem; font-size: 0.9rem;">
                    <span id="cv-email"></span>
                    <span id="cv-phone"></span>
                    <span id="cv-location"></span>
                </div>
            </div>

            <div class="cv-section">
                <h3>Education</h3>
                <div id="cv-education"></div>
            </div>

            <div class="cv-section">
                <h3>Research Experience</h3>
                <div id="cv-experience"></div>
            </div>

            <div class="cv-section">
                <h3>Key Skills</h3>
                <div id="cv-skills" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"></div>
            </div>

            <div class="cv-section">
                <h3>Selected Publications</h3>
                <div id="cv-publications"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function renderCV(data) {
            document.getElementById('cv-name').textContent = data.profile.name;
            document.getElementById('cv-title').textContent = data.profile.title;
            document.getElementById('cv-email').textContent = data.profile.email;
            document.getElementById('cv-phone').textContent = data.profile.phone;
            document.getElementById('cv-location').textContent = data.profile.location;

            const edu = document.getElementById('cv-education');
            data.education.forEach(e => {
                edu.innerHTML += `
                    <div class="cv-item">
                        <div class="cv-date">${e.period}</div>
                        <div>
                            <div style="font-weight: 700;">${e.degree}</div>
                            <div>${e.institution}</div>
                        </div>
                    </div>
                `;
            });

            const exp = document.getElementById('cv-experience');
            data.experience.forEach(e => {
                exp.innerHTML += `
                    <div class="cv-item">
                        <div class="cv-date">${e.period}</div>
                        <div>
                            <div style="font-weight: 700;">${e.role}</div>
                            <div style="font-weight: 600;">${e.institution}</div>
                            <div style="font-size: 0.9rem; margin-top: 0.3rem;">${e.description}</div>
                        </div>
                    </div>
                `;
            });

            const skills = document.getElementById('cv-skills');
            for (const [cat, list] of Object.entries(data.skills)) {
                skills.innerHTML += `
                    <div>
                        <div style="font-weight: 700; font-size: 0.8rem; margin-bottom: 0.3rem;">${cat.replace('_', ' ').toUpperCase()}</div>
                        <div style="font-size: 0.85rem;">${list.join(', ')}</div>
                    </div>
                `;
            }

            const pubs = document.getElementById('cv-publications');
            data.publications.slice(0, 5).forEach(p => {
                pubs.innerHTML += `
                    <div style="margin-bottom: 0.8rem; font-size: 0.9rem;">
                        <span style="font-weight: 700;">${p.year}</span> | ${p.title}. <em>${p.journal}</em>.
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
