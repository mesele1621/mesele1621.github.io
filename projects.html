<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .project-card { margin-bottom: 2rem; }
        .progress-container { width: 100%; height: 8px; background: var(--glass-border); border-radius: 4px; margin: 1rem 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s ease-in-out; }
        .project-meta { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; opacity: 0.7; }
        .status-badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        .status-ongoing { background: var(--accent-glow); color: var(--accent); }
        .status-completed { background: rgba(0,0,0,0.1); color: var(--text-main); }
    </style>
</head>
<body data-page="projects">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link">Publications</a>
                <a href="software.html" class="nav-link">Software</a>
                <a href="projects.html" class="nav-link active">Projects</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px;">
        <section class="projects-header fade-in">
            <div class="section-header">
                <h2>Research Projects</h2>
                <p style="max-width: 700px; margin: 1rem auto;">Selected research initiatives spanning virus discovery, bioinformatics workflow development, and applied crop biotechnology.</p>
            </div>

            <div id="projects-list" style="max-width: 900px; margin: 0 auto;">
                <!-- Populated via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function renderProjects(data) {
            const list = document.getElementById('projects-list');
            data.projects.forEach(p => {
                const isOngoing = p.status === 'Ongoing';
                const progress = isOngoing ? 75 : 100;
                
                list.innerHTML += `
                    <div class="glass-card project-card fade-in">
                        <div class="project-meta">
                            <span>${p.period}</span>
                            <span class="status-badge ${isOngoing ? 'status-ongoing' : 'status-completed'}">${p.status.toUpperCase()}</span>
                        </div>
                        <h3 style="margin: 0.5rem 0;">${p.title}</h3>
                        <p style="font-weight: 600; color: var(--accent); margin-bottom: 1rem;">${p.institution}</p>
                        <p>${p.description}</p>
                        ${p.impact ? `<p style="margin-top: 0.5rem; font-style: italic; font-size: 0.9rem;"><i class="fas fa-chart-line"></i> Impact: ${p.impact}</p>` : ''}
                        
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <div style="text-align: right; font-size: 0.7rem; opacity: 0.5;">Progress: ${progress}%</div>
                    </div>
                `;
            });
            initAnimations();
        }
    </script>
</body>
</html>
