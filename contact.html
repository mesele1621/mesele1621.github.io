<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 4rem; }
        .contact-info-item { display: flex; gap: 1.5rem; margin-bottom: 2.5rem; }
        .contact-icon { width: 50px; height: 50px; background: var(--accent-glow); color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-main); outline: none; transition: var(--transition-smooth); }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    </style>
</head>
<body data-page="contact">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link">Publications</a>
                <a href="software.html" class="nav-link">Software</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 5rem;">
        <section class="contact-header fade-in">
            <div class="section-header">
                <h2>Get In Touch</h2>
                <p style="max-width: 700px; margin: 1rem auto;">Available for academic collaborations, postdoctoral opportunities, and scientific consulting.</p>
            </div>

            <div class="contact-grid">
                <div class="fade-in">
                    <div class="contact-info-item">
                        <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                        <div>
                            <h4>Email</h4>
                            <p id="contact-email"></p>
                        </div>
                    </div>
                    <div class="contact-info-item">
                        <div class="contact-icon"><i class="fas fa-phone"></i></div>
                        <div>
                            <h4>Phone</h4>
                            <p id="contact-phone"></p>
                        </div>
                    </div>
                    <div class="contact-info-item">
                        <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div>
                            <h4>Location</h4>
                            <p id="contact-location"></p>
                        </div>
                    </div>
                    
                    <div class="social-links" style="display: flex; gap: 1rem; margin-top: 3rem;">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <div class="glass-card fade-in">
                    <form id="contact-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Subject</label>
                            <input type="text" class="form-control" placeholder="Collaboration / Inquiry" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea class="form-control" rows="5" placeholder="How can I help you?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function renderContact(data) {
            document.getElementById('contact-email').textContent = data.profile.email;
            document.getElementById('contact-phone').textContent = data.profile.phone;
            document.getElementById('contact-location').textContent = data.profile.location;

            const socials = document.querySelector('.social-links');
            for (const [key, url] of Object.entries(data.profile.social)) {
                let icon = 'fas fa-link';
                if (key === 'linkedin') icon = 'fab fa-linkedin';
                if (key === 'github') icon = 'fab fa-github';
                if (key === 'google_scholar') icon = 'fas fa-graduation-cap';
                if (key === 'orcid') icon = 'fab fa-orcid';
                if (key === 'researchgate') icon = 'fab fa-researchgate';
                if (key === 'facebook') icon = 'fab fa-facebook';

                socials.innerHTML += `
                    <a href="${url}" class="contact-icon" title="${key.replace('_', ' ')}"><i class="${icon}"></i></a>
                `;
            }

            document.getElementById('contact-form').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Thank you for your message! This is a demo form.');
            });

            initAnimations();
        }
    </script>
</body>
</html>
