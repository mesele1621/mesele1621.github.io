<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2.5rem; }
        .software-card { display: flex; flex-direction: column; height: 100%; }
        .software-img { width: 100%; height: 200px; background: #eee; border-radius: 8px; margin-bottom: 1.5rem; object-fit: cover; border: 1px solid var(--glass-border); }
        .software-status { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; background: var(--accent); color: white; padding: 0.2rem 0.6rem; border-radius: 4px; margin-left: 0.5rem; }
    </style>
</head>
<body data-page="software">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link">Publications</a>
                <a href="software.html" class="nav-link active">Software</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px;">
        <section class="software-header fade-in">
            <div class="section-header">
                <h2>Scientific Software</h2>
                <p style="max-width: 700px; margin: 1rem auto;">Custom tools and simulators developed for molecular biology, genomics, and bioinformatics research.</p>
            </div>

            <div id="software-list" class="software-grid">
                <!-- Populated via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function renderSoftware(data) {
            const list = document.getElementById('software-list');
            data.software.forEach(s => {
                list.innerHTML += `
                    <div class="glass-card software-card fade-in">
                        <img src="${s.screenshot}" alt="${s.name}" class="software-img" onerror="this.src='https://via.placeholder.com/400x200?text=${s.name}'">
                        <div style="flex-grow: 1;">
                            <h3 style="display: flex; align-items: center;">
                                ${s.name}
                                ${s.status ? `<span class="software-status">${s.status}</span>` : ''}
                            </h3>
                            <p style="font-size: 0.95rem; margin-bottom: 1rem;">${s.description}</p>
                            <div class="tags" style="margin-bottom: 1.5rem;">
                                ${s.features.map(f => `<span class="tag">${f}</span>`).join('')}
                            </div>
                        </div>
                        <div class="software-actions" style="display: flex; gap: 1rem; border-top: 1px solid var(--glass-border); padding-top: 1rem;">
                            ${s.demo_url ? `<a href="${s.demo_url}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.8rem;">Live Demo</a>` : ''}
                            ${s.github_url ? `<a href="${s.github_url}" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;"><i class="fab fa-github"></i> GitHub</a>` : ''}
                        </div>
                    </div>
                `;
            });
            initAnimations();
        }
    </script>
</body>
</html>
