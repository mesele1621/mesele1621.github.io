<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .pub-card { margin-bottom: 1.5rem; position: relative; overflow: hidden; }
        .pub-type { position: absolute; top: 0; right: 0; background: var(--accent); color: white; padding: 0.2rem 1rem; font-size: 0.7rem; font-weight: 700; border-bottom-left-radius: 8px; }
        .pub-journal { font-style: italic; color: var(--accent); font-weight: 600; }
        .pub-year { font-weight: 700; opacity: 0.7; }
        .pub-actions { margin-top: 1rem; display: flex; gap: 1rem; }
        .pub-actions a { font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem; color: var(--accent); }
        .pub-actions a:hover { text-decoration: underline; }
        .search-bar { margin-bottom: 3rem; display: flex; gap: 1rem; }
        .search-input { flex: 1; padding: 0.8rem 1.5rem; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-main); outline: none; }
        .filter-select { padding: 0.8rem 1.5rem; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-main); outline: none; cursor: pointer; }
    </style>
</head>
<body data-page="publications">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link active">Publications</a>
                <a href="software.html" class="nav-link">Software</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px;">
        <section class="publications-header fade-in">
            <div class="section-header">
                <h2>Peer-Reviewed Research</h2>
                <p id="pub-count-text"></p>
            </div>

            <div class="search-bar fade-in">
                <input type="text" id="pub-search" class="search-input" placeholder="Search by title, journal, or keyword...">
                <select id="pub-filter-year" class="filter-select">
                    <option value="all">All Years</option>
                </select>
            </div>

            <div id="publications-list">
                <!-- Populated via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let allPublications = [];

        function renderPublications(data) {
            allPublications = data.publications;
            document.getElementById('pub-count-text').textContent = `${allPublications.length} peer-reviewed publications across leading virology and plant pathology journals.`;

            // Populate Year Filter
            const years = [...new Set(allPublications.map(p => p.year))].sort((a, b) => b - a);
            const yearSelect = document.getElementById('pub-filter-year');
            years.forEach(y => {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            });

            // Initial Render
            displayPublications(allPublications);

            // Search & Filter Events
            document.getElementById('pub-search').addEventListener('input', filterPubs);
            document.getElementById('pub-filter-year').addEventListener('change', filterPubs);
        }

        function filterPubs() {
            const searchTerm = document.getElementById('pub-search').value.toLowerCase();
            const yearFilter = document.getElementById('pub-filter-year').value;

            const filtered = allPublications.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || 
                                    p.journal.toLowerCase().includes(searchTerm) ||
                                    p.authors.toLowerCase().includes(searchTerm);
                const matchesYear = yearFilter === 'all' || p.year === yearFilter;
                return matchesSearch && matchesYear;
            });

            displayPublications(filtered);
        }

        function displayPublications(pubs) {
            const list = document.getElementById('publications-list');
            list.innerHTML = '';

            if (pubs.length === 0) {
                list.innerHTML = '<p style="text-align: center; padding: 3rem; opacity: 0.5;">No publications found matching your criteria.</p>';
                return;
            }

            pubs.forEach(p => {
                list.innerHTML += `
                    <div class="glass-card pub-card fade-in">
                        <span class="pub-type">${p.type.toUpperCase()}</span>
                        <span class="pub-year">${p.year}</span>
                        <h4 style="margin: 0.5rem 0 1rem 0; line-height: 1.4; font-size: 1.2rem;">${p.title}</h4>
                        <p style="font-size: 0.9rem; margin-bottom: 0.5rem;">${p.authors}</p>
                        <p class="pub-journal">${p.journal}${p.volume ? `, ${p.volume}` : ''}${p.pages ? `, ${p.pages}` : ''}</p>
                        <div class="pub-actions">
                            ${p.doi ? `<a href="https://doi.org/${p.doi}" target="_blank"><i class="fas fa-external-link-alt"></i> DOI</a>` : ''}
                            <a href="#"><i class="fas fa-quote-right"></i> Cite</a>
                            <a href="#"><i class="fas fa-file-pdf"></i> PDF</a>
                            <a href="${data.profile.social.google_scholar}" target="_blank"><i class="fas fa-graduation-cap"></i> Scholar</a>
                        </div>
                    </div>
                `;
            });
            initAnimations();
        }
    </script>
</body>
</html>
