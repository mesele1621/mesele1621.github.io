<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Mesele Tilahun Belete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="about">
    
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">M.T. BELETE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link active">About</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="publications.html" class="nav-link">Publications</a>
                <a href="software.html" class="nav-link">Software</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px;">
        <section class="about-header fade-in">
            <div class="section-header">
                <h2>About Me</h2>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 4rem; align-items: start;">
                <div class="glass-card">
                    <img src="images/profile.jpg" alt="Profile" style="width: 100%; border-radius: 8px; margin-bottom: 1.5rem;">
                    <h3 id="profile-name"></h3>
                    <p id="profile-role" style="color: var(--accent); font-weight: 600;"></p>
                    <hr style="margin: 1.5rem 0; opacity: 0.1;">
                    <div id="contact-info">
                        <!-- Populated via JS -->
                    </div>
                </div>
                <div>
                    <h3 style="font-size: 2rem; margin-bottom: 1.5rem;">Professional Profile</h3>
                    <p id="long-bio" style="font-size: 1.1rem; margin-bottom: 2rem;"></p>
                    
                    <h3>Education</h3>
                    <div id="education-list" style="margin-bottom: 2rem;">
                        <!-- Populated via JS -->
                    </div>

                    <h3>Experience</h3>
                    <div id="experience-list">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>
        </section>

        <section class="skills-section fade-in">
            <div class="section-header">
                <h2>Technical Toolkit</h2>
            </div>
            <div id="skills-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
                <!-- Populated via JS -->
            </div>
        </section>

        <section class="awards-section fade-in">
            <div class="section-header">
                <h2>Recognition</h2>
            </div>
            <div id="awards-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                <!-- Populated via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; <span id="copyright-year"></span> Mesele Tilahun Belete. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        function renderAbout(data) {
            document.getElementById('profile-name').textContent = data.profile.name;
            document.getElementById('profile-role').textContent = data.profile.title;
            document.getElementById('long-bio').textContent = data.profile.long_bio;

            const contact = document.getElementById('contact-info');
            contact.innerHTML = `
                <p><i class="fas fa-envelope"></i> ${data.profile.email}</p>
                <p><i class="fas fa-phone"></i> ${data.profile.phone}</p>
                <p><i class="fas fa-map-marker-alt"></i> ${data.profile.location}</p>
            `;

            const edu = document.getElementById('education-list');
            data.education.forEach(e => {
                edu.innerHTML += `
                    <div class="edu-item" style="margin-bottom: 1rem;">
                        <span style="color: var(--accent); font-weight: 700;">${e.period}</span>
                        <h4>${e.degree}</h4>
                        <p>${e.institution}</p>
                    </div>
                `;
            });

            const exp = document.getElementById('experience-list');
            data.experience.forEach(e => {
                exp.innerHTML += `
                    <div class="glass-card" style="margin-bottom: 1.5rem;">
                        <span style="color: var(--accent); font-weight: 700;">${e.period}</span>
                        <h4>${e.role}</h4>
                        <p style="font-weight: 600;">${e.institution} | ${e.location}</p>
                        <p style="margin-top: 0.5rem; font-size: 0.9rem;">${e.description}</p>
                    </div>
                `;
            });

            const skills = document.getElementById('skills-grid');
            for (const [category, list] of Object.entries(data.skills)) {
                const title = category.replace('_', ' ').toUpperCase();
                skills.innerHTML += `
                    <div class="glass-card">
                        <h4 style="color: var(--accent); border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; margin-bottom: 1rem;">${title}</h4>
                        <div class="tags">
                            ${list.map(s => `<span class="tag">${s}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            const awards = document.getElementById('awards-list');
            data.awards.forEach(a => {
                awards.innerHTML += createCard(a.title, `${a.institution} | ${a.date}`, a.description || '');
            });

            initAnimations();
        }
    </script>
</body>
</html>
